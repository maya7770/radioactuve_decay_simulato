<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radioaktiv Parchalanish Simulyatori</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Onest:wght@400;600;700&display=swap');
        
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #141937;
            --bg-card: #1a1f3a;
            --accent-nuclear: #00ff88;
            --accent-decay: #ff2e63;
            --accent-warning: #ffb800;
            --text-primary: #e8edf4;
            --text-secondary: #8892b0;
            --border-glow: rgba(0, 255, 136, 0.3);
            --grid-color: rgba(0, 255, 136, 0.05);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Onest', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease;
        }
        
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-nuclear), var(--accent-warning));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }
        
        .control-panel {
            background: var(--bg-card);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease 0.2s both;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .input-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-secondary);
            border: 2px solid rgba(0, 255, 136, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-nuclear);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        
        button {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Onest', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-nuclear), #00cc70);
            color: var(--bg-primary);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }
        
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid rgba(0, 255, 136, 0.3);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--accent-nuclear);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .speed-control {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .speed-label {
            color: var(--text-secondary);
            font-weight: 600;
            margin-right: 10px;
            font-size: 0.9rem;
        }
        
        .speed-btn {
            flex: 1;
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 2px solid rgba(0, 255, 136, 0.2);
            color: var(--text-secondary);
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .speed-btn.active {
            background: var(--accent-nuclear);
            color: var(--bg-primary);
            border-color: var(--accent-nuclear);
            font-weight: 700;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease 0.4s both;
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-nuclear);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--accent-nuclear), var(--accent-warning));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .visualization-section {
            background: var(--bg-card);
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease 0.6s both;
        }
        
        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--accent-nuclear);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--accent-nuclear), var(--accent-warning));
            border-radius: 2px;
        }
        
        .atom-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .atom {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid;
            transition: all 0.3s ease;
            animation: atomPulse 0.5s ease;
        }
        
        @keyframes atomPulse {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .atom.active {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--accent-nuclear);
            color: var(--accent-nuclear);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        
        .atom.decayed {
            background: rgba(255, 46, 99, 0.1);
            border-color: var(--accent-decay);
            color: var(--accent-decay);
            box-shadow: 0 0 15px rgba(255, 46, 99, 0.3);
            animation: decayFlash 0.5s ease;
        }
        
        @keyframes decayFlash {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
                box-shadow: 0 0 25px rgba(255, 46, 99, 0.6);
            }
        }
        
        .chart-container {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            height: 400px;
            position: relative;
        }
        
        canvas {
            max-width: 100%;
        }
        
        /* Half-life table styles */
        #halfLifeTable {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
        }
        
        #halfLifeTable thead {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(255, 184, 0, 0.2));
        }
        
        #halfLifeTable th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 700;
            color: var(--accent-nuclear);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--accent-nuclear);
        }
        
        #halfLifeTable td {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
            color: var(--text-primary);
        }
        
        #halfLifeTable tbody tr {
            transition: all 0.3s ease;
        }
        
        #halfLifeTable tbody tr:hover {
            background: rgba(0, 255, 136, 0.05);
        }
        
        #halfLifeTable tbody tr:last-child td {
            border-bottom: none;
        }
        
        #halfLifeTable .round-cell {
            color: var(--accent-warning);
            font-weight: 700;
        }
        
        #halfLifeTable .active-cell {
            color: var(--accent-nuclear);
            font-weight: 600;
        }
        
        #halfLifeTable .decayed-cell {
            color: var(--accent-decay);
            font-weight: 600;
        }
        
        #halfLifeTable .percentage-cell {
            color: var(--text-secondary);
        }
        
        @media (max-width: 768px) {
            #halfLifeTable th,
            #halfLifeTable td {
                padding: 10px 12px;
                font-size: 0.85rem;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                min-width: 100%;
            }
            
            .atom-grid {
                grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
                gap: 6px;
            }
            
            .atom {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>☢️ Radioaktiv Parchalanish Simulyatori</h1>
            <p class="subtitle">Atomlarning tasodifiy parchalanishini kuzating</p>
        </header>
        
        <div class="control-panel">
            <div class="input-group">
                <label for="atomCount">Atomlar soni (1-1000):</label>
                <input type="number" id="atomCount" min="1" max="1000" value="25" placeholder="Atomlar sonini kiriting">
            </div>
            
            <div class="button-group">
                <button class="btn-primary" id="startBtn">Simulyatsiyani boshlash</button>
                <button class="btn-secondary" id="stepBtn" disabled>Bir qadam</button>
                <button class="btn-secondary" id="resetBtn">Qayta boshlash</button>
            </div>
            
            <div class="speed-control">
                <span class="speed-label">Tezlik:</span>
                <button class="speed-btn" data-speed="1000">Sekin</button>
                <button class="speed-btn active" data-speed="500">O'rtacha</button>
                <button class="speed-btn" data-speed="200">Tez</button>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Jami atomlar</div>
                <div class="stat-value" id="totalAtoms">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Faol atomlar</div>
                <div class="stat-value" id="activeAtoms">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Parchalangan</div>
                <div class="stat-value" id="decayedAtoms">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Raundlar</div>
                <div class="stat-value" id="roundCount">0</div>
            </div>
        </div>
        
        <div class="visualization-section">
            <h2 class="section-title">Atomlar holati</h2>
            <div class="atom-grid" id="atomGrid"></div>
        </div>
        
        <div class="visualization-section">
            <h2 class="section-title">Yarim yemirilish davri jadvali</h2>
            <div style="overflow-x: auto;">
                <table id="halfLifeTable">
                    <thead>
                        <tr>
                            <th>Raund</th>
                            <th>Faol atomlar</th>
                            <th>Parchalangan atomlar</th>
                            <th>Parchalanish foizi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="visualization-section">
            <h2 class="section-title">Parchalanish grafigi</h2>
            <div class="chart-container">
                <canvas id="decayChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        class RadioactiveDecaySimulator {
            constructor() {
                this.atoms = [];
                this.totalAtoms = 0;
                this.round = 0;
                this.isRunning = false;
                this.intervalId = null;
                this.speed = 500;
                this.chartData = {
                    labels: [],
                    active: [],
                    decayed: []
                };
                
                this.initElements();
                this.initChart();
                this.initEventListeners();
            }
            
            initElements() {
                this.atomCountInput = document.getElementById('atomCount');
                this.startBtn = document.getElementById('startBtn');
                this.stepBtn = document.getElementById('stepBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.atomGrid = document.getElementById('atomGrid');
                this.totalAtomsDisplay = document.getElementById('totalAtoms');
                this.activeAtomsDisplay = document.getElementById('activeAtoms');
                this.decayedAtomsDisplay = document.getElementById('decayedAtoms');
                this.roundCountDisplay = document.getElementById('roundCount');
            }
            
            initChart() {
                const ctx = document.getElementById('decayChart').getContext('2d');
                this.chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            {
                                label: 'Faol atomlar',
                                data: [],
                                borderColor: '#00ff88',
                                backgroundColor: 'rgba(0, 255, 136, 0.1)',
                                borderWidth: 3,
                                tension: 0.4,
                                fill: true,
                                pointRadius: 4,
                                pointBackgroundColor: '#00ff88',
                                pointBorderColor: '#0a0e27',
                                pointBorderWidth: 2
                            },
                            {
                                label: 'Parchalangan atomlar',
                                data: [],
                                borderColor: '#ff2e63',
                                backgroundColor: 'rgba(255, 46, 99, 0.1)',
                                borderWidth: 3,
                                tension: 0.4,
                                fill: true,
                                pointRadius: 4,
                                pointBackgroundColor: '#ff2e63',
                                pointBorderColor: '#0a0e27',
                                pointBorderWidth: 2
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#e8edf4',
                                    font: {
                                        family: 'Onest',
                                        size: 14,
                                        weight: 600
                                    },
                                    padding: 20
                                }
                            },
                            tooltip: {
                                backgroundColor: 'rgba(26, 31, 58, 0.95)',
                                titleColor: '#00ff88',
                                bodyColor: '#e8edf4',
                                borderColor: '#00ff88',
                                borderWidth: 1,
                                padding: 12,
                                titleFont: {
                                    size: 14,
                                    weight: 'bold'
                                },
                                bodyFont: {
                                    size: 13
                                }
                            }
                        },
                        scales: {
                            x: {
                                grid: {
                                    color: 'rgba(0, 255, 136, 0.1)'
                                },
                                ticks: {
                                    color: '#8892b0',
                                    font: {
                                        family: 'JetBrains Mono'
                                    }
                                },
                                title: {
                                    display: true,
                                    text: 'Raund',
                                    color: '#e8edf4',
                                    font: {
                                        size: 14,
                                        weight: 'bold'
                                    }
                                }
                            },
                            y: {
                                grid: {
                                    color: 'rgba(0, 255, 136, 0.1)'
                                },
                                ticks: {
                                    color: '#8892b0',
                                    font: {
                                        family: 'JetBrains Mono'
                                    }
                                },
                                title: {
                                    display: true,
                                    text: 'Atomlar soni',
                                    color: '#e8edf4',
                                    font: {
                                        size: 14,
                                        weight: 'bold'
                                    }
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
            
            initEventListeners() {
                this.startBtn.addEventListener('click', () => this.toggleSimulation());
                this.stepBtn.addEventListener('click', () => this.stepSimulation());
                this.resetBtn.addEventListener('click', () => this.reset());
                
                document.querySelectorAll('.speed-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.speed = parseInt(e.target.dataset.speed);
                        
                        if (this.isRunning) {
                            clearInterval(this.intervalId);
                            this.intervalId = setInterval(() => this.stepSimulation(), this.speed);
                        }
                    });
                });
            }
            
            initialize() {
                const count = parseInt(this.atomCountInput.value);
                
                if (isNaN(count) || count < 1 || count > 1000) {
                    alert('Iltimos, 1 dan 1000 gacha bo\'lgan son kiriting!');
                    return false;
                }
                
                this.totalAtoms = count;
                // Start with all atoms active (not rolled yet)
                this.atoms = new Array(count).fill(1);
                this.round = 0;
                
                // Initialize chart with all atoms active at round 0
                this.chartData = {
                    labels: [0],
                    active: [count],
                    decayed: [0]
                };
                
                this.updateDisplay();
                this.updateChart();
                this.updateTable();
                this.stepBtn.disabled = false;
                
                return true;
            }
            
            rollDice() {
                return Math.floor(Math.random() * 6) + 1;
            }
            
            stepSimulation() {
                this.round++;
                
                // Roll dice for all non-decayed atoms
                for (let i = 0; i < this.atoms.length; i++) {
                    if (this.atoms[i] !== 6) {
                        this.atoms[i] = this.rollDice();
                    }
                }
                
                this.chartData.labels.push(this.round);
                this.chartData.active.push(this.getActiveCount());
                this.chartData.decayed.push(this.getDecayedCount());
                
                this.updateDisplay();
                this.updateChart();
                this.updateTable();
                
                // Stop if all atoms have decayed
                if (this.getActiveCount() === 0) {
                    this.stopSimulation();
                }
            }
            
            getActiveCount() {
                return this.atoms.filter(atom => atom !== 6).length;
            }
            
            getDecayedCount() {
                return this.atoms.filter(atom => atom === 6).length;
            }
            
            updateDisplay() {
                // Update stats
                this.totalAtomsDisplay.textContent = this.totalAtoms;
                this.activeAtomsDisplay.textContent = this.getActiveCount();
                this.decayedAtomsDisplay.textContent = this.getDecayedCount();
                this.roundCountDisplay.textContent = this.round;
                
                // Update atom grid
                this.atomGrid.innerHTML = '';
                this.atoms.forEach((value, index) => {
                    const atomDiv = document.createElement('div');
                    atomDiv.className = `atom ${value === 6 ? 'decayed' : 'active'}`;
                    atomDiv.textContent = value;
                    this.atomGrid.appendChild(atomDiv);
                });
            }
            
            updateChart() {
                this.chart.data.labels = this.chartData.labels;
                this.chart.data.datasets[0].data = this.chartData.active;
                this.chart.data.datasets[1].data = this.chartData.decayed;
                this.chart.update();
            }
            
            updateTable() {
                const tableBody = document.getElementById('tableBody');
                const activeCount = this.getActiveCount();
                const decayedCount = this.getDecayedCount();
                const percentage = ((decayedCount / this.totalAtoms) * 100).toFixed(1);
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="round-cell">${this.round}</td>
                    <td class="active-cell">${activeCount}</td>
                    <td class="decayed-cell">${decayedCount}</td>
                    <td class="percentage-cell">${percentage}%</td>
                `;
                
                tableBody.appendChild(row);
                
                // Auto-scroll to the latest row
                row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
            
            toggleSimulation() {
                if (!this.isRunning) {
                    if (this.round === 0) {
                        if (!this.initialize()) return;
                    }
                    this.startSimulation();
                } else {
                    this.stopSimulation();
                }
            }
            
            startSimulation() {
                this.isRunning = true;
                this.startBtn.textContent = 'To\'xtatish';
                this.startBtn.classList.remove('btn-primary');
                this.startBtn.classList.add('btn-secondary');
                this.stepBtn.disabled = true;
                this.atomCountInput.disabled = true;
                
                this.intervalId = setInterval(() => this.stepSimulation(), this.speed);
            }
            
            stopSimulation() {
                this.isRunning = false;
                this.startBtn.textContent = 'Davom ettirish';
                this.startBtn.classList.add('btn-primary');
                this.startBtn.classList.remove('btn-secondary');
                this.stepBtn.disabled = false;
                
                if (this.intervalId) {
                    clearInterval(this.intervalId);
                    this.intervalId = null;
                }
            }
            
            reset() {
                this.stopSimulation();
                this.atoms = [];
                this.totalAtoms = 0;
                this.round = 0;
                this.chartData = {
                    labels: [],
                    active: [],
                    decayed: []
                };
                
                this.atomGrid.innerHTML = '';
                this.totalAtomsDisplay.textContent = '0';
                this.activeAtomsDisplay.textContent = '0';
                this.decayedAtomsDisplay.textContent = '0';
                this.roundCountDisplay.textContent = '0';
                
                // Clear table
                document.getElementById('tableBody').innerHTML = '';
                
                this.chart.data.labels = [];
                this.chart.data.datasets[0].data = [];
                this.chart.data.datasets[1].data = [];
                this.chart.update();
                
                this.startBtn.textContent = 'Simulyatsiyani boshlash';
                this.startBtn.classList.add('btn-primary');
                this.startBtn.classList.remove('btn-secondary');
                this.stepBtn.disabled = true;
                this.atomCountInput.disabled = false;
            }
        }
        
        // Initialize the simulator when page loads
        const simulator = new RadioactiveDecaySimulator();
    </script>
